[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "self-deepsearch-media"
version = "0.1.0"
description = "Controlled image processing and S3 publication for Release A"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34,<2",
  "Pillow>=10.4,<12",
]

[tool.setuptools.packages.find]
include = ["media_worker*"]
