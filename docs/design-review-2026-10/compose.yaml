name: self-deepsearch-design-review

services:
  design-review:
    image: python:3.12-slim-bookworm
    container_name: self-deepsearch-design-review
    restart: unless-stopped
    # Ubuntu: share the network namespace so the server can bind host loopback.
    # The server itself permits only 127.0.0.1; no public listener is created.
    network_mode: host
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    command: ["python", "-B", "-u", "/review/scripts/serve_design_review.py", "--port", "13004"]
    volumes:
      - .:/review/docs/design-review-2026-10:ro
      - ../../scripts/serve_design_review.py:/review/scripts/serve_design_review.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:13004/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
